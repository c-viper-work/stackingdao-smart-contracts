[project]
name = "pox5-harness"
description = "Self-contained Clarinet harness running the REAL pox-5.clar in simnet"
authors = []
telemetry = false
cache_dir = "./.cache"

# ---------------------------------------------------------------------------
# Mainnet sBTC contracts pulled as requirements.
# pox-5.clar hard-references SM3VDXK3...sbtc-token (transfer / get-balance);
# signer-manager.clar references sbtc-token + sbtc-withdrawal. Listing
# sbtc-deposit + sbtc-withdrawal pulls sbtc-token + sbtc-registry transitively.
# The resolved .clar/.json are committed under .cache/requirements/ so the
# first run works OFFLINE (no Stacks API call needed).
# ---------------------------------------------------------------------------
[[project.requirements]]
contract_id = "SM3VDXK3WZZSA84XXFKAFAF15NNZX32CTSG82JFQ4.sbtc-deposit"

[[project.requirements]]
contract_id = "SM3VDXK3WZZSA84XXFKAFAF15NNZX32CTSG82JFQ4.sbtc-withdrawal"

[repl]
costs_version = 1

[contracts.pox-5]
path = "contracts/vendor/pox-5.clar"
clarity_version = 6
epoch = "4.0"
depends_on = []

[contracts.test-pox-5-signer]
path = "contracts/vendor/test-pox-5-signer.clar"
clarity_version = 6
epoch = "4.0"
depends_on = ["pox-5"]

